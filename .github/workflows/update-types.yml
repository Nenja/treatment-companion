name: Update database types

# Keeps lib/database.types.ts in sync with the live database so the generated
# file stays authoritative instead of hand-edited.
#
# WHEN IT RUNS
#   - Manually: Actions tab -> "Update database types" -> Run workflow.
#     Use this right after you apply a migration in the Supabase SQL editor.
#   - Nightly (safety net), in case a schema change was applied without a run.
#
# It regenerates the file, and ONLY commits when the types actually changed.
# That commit lands on the branch like any other, so Vercel deploys the
# refreshed types automatically.
#
# ONE-TIME SETUP  (GitHub repo -> Settings -> Secrets and variables -> Actions
#                  -> New repository secret), add BOTH:
#   SUPABASE_ACCESS_TOKEN  Supabase dashboard -> (your avatar) Account
#                          -> Access Tokens -> Generate new token.
#   SUPABASE_PROJECT_ID    Supabase dashboard -> Project Settings -> General
#                          -> "Reference ID"  (also the <ref> in
#                          https://<ref>.supabase.co).

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC nightly

permissions:
  contents: write

concurrency:
  group: update-db-types
  cancel-in-progress: true

jobs:
  update-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the Supabase CLI that package.json's `gen:types` script calls.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Regenerate types from the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: npm run gen:types

      - name: Commit only if the types changed
        run: |
          if [ -n "$(git status --porcelain lib/database.types.ts)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/database.types.ts
            git commit -m "chore: regenerate database.types.ts from live schema"
            git push
          else
            echo "database.types.ts is already up to date."
          fi
