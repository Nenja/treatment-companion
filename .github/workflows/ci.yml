name: CI

# Runs on every push to main and on every pull request. Two independent jobs:
#   • verify     — type-check, i18n parity, and a full production build
#   • migrations — apply every numbered schema migration to a throwaway
#                  Postgres, from scratch, in order, to catch ordering /
#                  dependency / syntax errors before they reach Supabase.
# Neither job touches the production project; no secrets are required.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, i18n & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: i18n parity (en / da)
        run: node scripts/check-i18n-parity.mjs

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Placeholder public values so the build completes. These are not
          # secrets and are never used to connect anywhere in CI.
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key-for-build-only'

  migrations:
    name: Migrations apply cleanly from scratch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ci
    steps:
      - uses: actions/checkout@v4

      # Node is only needed for the schema-contract check below; that script
      # uses Node built-ins only, so no npm install is required.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase-like environment
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/bootstrap.sql

      - name: Apply numbered migrations in order
        run: |
          set -euo pipefail
          applied=0
          skipped=0
          for f in $(ls -1 supabase/migrations/[0-9]*.sql | sort); do
            if grep -q "ci:skip" "$f"; then
              echo "skip (dev-seed):  $f"
              skipped=$((skipped + 1))
              continue
            fi
            echo "apply:            $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            applied=$((applied + 1))
          done
          echo ""
          echo "✓ Applied $applied schema migrations cleanly (skipped $skipped dev-seed)."

      - name: Snapshot the resulting schema
        run: psql -tA -f supabase/ci/dump-schema.sql > schema.json

      - name: Schema-contract check (app queries vs schema)
        run: node scripts/check-schema-contract.mjs schema.json

      # Runtime RLS-denial tests. Converts the throwaway DB (real policies, all
      # migrations applied) into one where auth.uid() is impersonatable, then
      # asserts cross-patient isolation, clinician-session gating (incl. the
      # 1-hour staleness cutoff), anonymous denial, the 0096 care-team-note
      # right-of-access boundary, and admin-only study tables. Each denial is
      # paired with a positive control so a "deny everything" bug can't pass.
      - name: RLS-denial tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/ci/rls-test-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/ci/rls-tests.sql
