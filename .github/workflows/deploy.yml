name: Deploy (production, on green CI)

# Deploy-on-green: production is deployed ONLY after the CI workflow ("CI")
# finishes successfully on `main`. This makes CI a real gate instead of a
# signal — even when code is committed directly to main (the zip-upload flow),
# production never updates from a red build.
#
# INERT BY DEFAULT. Until the four secrets below are set in
# GitHub → Settings → Secrets and variables → Actions, the deploy job detects
# the missing token and skips — so dropping this file into the repo changes
# nothing on its own.
#
# To ACTIVATE (do all three, see docs/STAGING-AND-CI-GATE.md for the click-path):
#   1. In Vercel → Project → Settings → Git, turn OFF automatic production
#      deployments (otherwise Vercel deploys on push AND this workflow does —
#      double deploys, and Vercel's would not be gated on CI).
#   2. Add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#   3. (Recommended, with the developer) protect `main` and require the CI check.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Only fire for CI runs on `main`. Without this, every Dependabot / PR-branch
    # CI run also triggers this workflow (it then skips via the in-job guard, but
    # it still appears as a gray "skipped" row AND starts with prod secrets in
    # scope). Filtering at the trigger means it never starts for non-main runs.
    # The in-job `head_branch == 'main'` guard below stays as belt-and-suspenders.
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    # Only when CI succeeded, and only for main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Guard — is deploy configured?
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not set — deploy is inert. See docs/STAGING-AND-CI-GATE.md to activate."
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy (Vercel CLI, prebuilt, production)
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Build-time public vars, supplied as repo secrets (see below). These
          # are NEXT_PUBLIC_* (inlined at build) and are public values anyway.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

          # ── Force the build-time public env from CI secrets ─────────────────
          # NEXT_PUBLIC_* are inlined at BUILD time. Rather than depend on
          # `vercel pull` delivering them (it skips "Sensitive" vars and is
          # scope-sensitive — the cause of the 500s), write the authoritative
          # values into the env file that `vercel build` reads. Within one env
          # file the FIRST definition wins, so drop any pulled (possibly blank)
          # copies before appending ours.
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Repo secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are not set. Add them in Settings → Secrets and variables → Actions (production values; they're public, safe in CI)."
            exit 1
          fi
          ENVFILE=.vercel/.env.production.local
          touch "$ENVFILE"
          sed -i '/^NEXT_PUBLIC_SUPABASE_URL=/d;/^NEXT_PUBLIC_SUPABASE_ANON_KEY=/d' "$ENVFILE"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n'      "$NEXT_PUBLIC_SUPABASE_URL"      >> "$ENVFILE"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$ENVFILE"

          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

          # Confirm the public Supabase URL actually got inlined before shipping
          # (catches a build that ran but didn't bake the value in for any reason).
          if ! grep -rqs "supabase.co" .vercel/output 2>/dev/null; then
            echo "::error::Built output contains no Supabase URL — public env wasn't inlined. Refusing to deploy a build that would 500."
            exit 1
          fi

          # --archive=tgz uploads ONE archive instead of hundreds of individual
          # files. Vercel's free tier caps CLI/API uploads at 5000 FILES per 24h
          # (error code "api-upload-free"); a prebuilt Next build is hundreds of
          # files, so a handful of deploys/day would otherwise exhaust it. With
          # the archive, each deploy counts as ~1 upload.
          npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
