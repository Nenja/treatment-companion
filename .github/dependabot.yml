# Dependabot keeps dependencies current and opens security-fix PRs.
#
# IMPORTANT — also flip two toggles once (Settings -> Code security):
#   • Dependabot alerts            (detects vulnerable deps)
#   • Dependabot security updates  (auto-opens PRs to fix them)
# This file only configures the SCHEDULED version-update PRs below.
#
# Every PR Dependabot opens updates package.json AND package-lock.json together
# (so it can't create the lockfile mismatch we hit), and your CI (verify +
# migrations, which run on pull_request) checks each one — so a PR that goes
# green is safe to merge. Review/merge from the Pull requests tab.
version: 2
updates:
  # Application dependencies (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle low-risk minor + patch bumps into ONE PR to cut noise.
      # Major bumps still arrive as separate PRs to review individually.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions (actions/checkout, setup-node, upload-artifact, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
